<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./aula06.css">

    <title>Aula06 - flexbox</title>
</head>
<body>
    <div class="dashboard-container">
        <!-- SIDEBAR / MENU LATERAL -->
         <div class="sidebar">
            <h2 style="margin-bottom: 10px;"> Painel</h2>
            <div class="menu-item">Inicio</div>
            <div class="menu-item">Analitycs</div>
            <div class="menu-item">Produtos</div>
            <div class="menu-item">Mensagens</div>
            <div class="menu-item">Configurações</div>
         </div>

         <!-- CONTEUDO PRINCIPAL -->

         <div class="main-content">

            <!-- LINHAS DE ESTATISTICAS -->
             <div class="starts-row">
                <div class="stat-box stat-1">
                    <h3>Usuarios ativos</h3>
                    <p>+8.432</p>
                </div>
                <div class="stat-box stat-1">
                    <h3>Recita mensal</h3>
                    <p>R$ 45.900</p>
                </div>
                <div class="stat-box stat-1">
                    <h3>Conversão</h3>
                    <p>14,2%</p>
                </div>
             </div>
         </div>

             <!-- LINHA DE CAIXAR DE CONTEUDO -->
            <div class="grid-row">
                <div class="container-box">
                    <h2>Visão geral do sistema</h2>
                    <p style="color: #94a3b8; line-height: 1.5;">Este painel utiliza as caixas organizadoras flexiveis.</p>
                    <div class="inneer-boxes">
                        <div class="mini-box">Caixa A</div>
                        <div class="mini-box">Caixa B</div>
                        <div class="mini-box">Caixa C</div>
                    </div>
                </div>
            </div>
    </div>
</body>
</html>
