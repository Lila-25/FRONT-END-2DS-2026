<!DOCTYPE html>
<html lang="pt-br">
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade01</title>

    <style>

        body {
           overflow: hidden;
           width: 100%;
           height: 100vh;
           background-color: white;
           display: flex;
           justify-content: center;
           align-items: center;
        }

        .caixanumero{
              width: 100px;
              height: 100px;
              border: 1px solid blue;
              background-color: blue;
              border-radius: 10px;
              display: flex;
              justify-content: center;
              align-items: center;
              margin: 10px;
        }

        .teste {
             width: 70%;
             height: 70%;
             display: flex;
             align-items: center;
             justify-content: center;
             color: white;
             
        }  

    </style>
   </head>

 <body>
    <div class="caixanumero">
        <div class="teste">1</div>
    </div>

       <div class="caixanumero">
        <div class="teste">2</div>
    </div>

       <div class="caixanumero">
        <div class="teste">3</div>
    </div>
    
 </body>
</html>
